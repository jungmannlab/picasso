[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picassosr"
dynamic = ["version"]
authors = [
    {name = "Rafal Kowalewski", email = "rafalkowalewski998@gmail.com"},
    {name = "Joerg Schnitzbauer", email = "joschnitzbauer@gmail.com"},
    {name = "Maximilian T. Strauss", email = "straussmaximilian@gmail.com"},
]
maintainers = [{name = "Rafal Kowalewski", email = "rafalkowalewski998@gmail.com"}]
keywords = [
    "super-resolution",
    "DNA-PAINT",
    "microscopy",
    "SMLM",
    "single-molecule localization microscopy",
]
description = "Single-molecule localization microscopy (SMLM) analysis, from raw movies to localization, rendering and quantification"
readme = "readme.rst"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE.txt", "LICENSES/*.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyQt6>=6.10.2,<7",  # prevent backward incompatible changes
    "numpy>=2.2.6,<3",
    "matplotlib>=3.10.7,<4",
    "h5py>=3.15.1,<4",
    "numba>=0.62.1,<1",
    "scipy>=1.15.3,<2",
    "pandas>=2.3.3,<4",
    "tables>=3.10.1,<4",
    "pyyaml>=6.0.3,<7",
    "scikit-learn>=1.5.0,<2",
    "tqdm>=4.67.1,<5",
    "nd2>=0.10.4,<1",
    "dask>=2024.8.0",  # calendar versions, no major release to stop at
    "statsmodels>=0.14.3,<1",  # NumPy 2 (0.14.2 fails on Apple Silicon)
    "requests>=2.31.0,<3",
    "psutil>=7.1.1,<8",
    "playsound3>=3.2.8,<4",
    "imageio>=2.37.0,<3",
    "imageio-ffmpeg>=0.6.0,<1",
    "tifffile>=2024.7.24",
    "wgpu>=0.32,<0.33",
    "PyImarisWriter==0.7.0; sys_platform=='win32'",
    "hdf5plugin"
]

[project.optional-dependencies]
# CUDA fitting and tools (numba-cuda) for the given CUDA toolkit. GPU
# rendering (wgpu) is part of the core dependencies.
cuda11 = [
    "numba-cuda[cu11]"
]
cuda12 = [
    "numba-cuda[cu12]"
]
cuda13 = [
    "numba-cuda[cu13]"
]
# Alias for the most common CUDA toolkit (12.x).
gpu = [
    "picassosr[cuda12]"
]
# Picasso Server (picasso server), the browser app that watches folders
# and keeps a history of the localized files
server = [
    "streamlit>=1.50.0,<2",
    "plotly>=5.12.0,<7",  # 5.12: NumPy 2 (no np.bool8)
]
dev = [
    "build",
    "black",
    "pre-commit",
    "twine",
]
# Optional movie-format readers (czifile, liffile and ptufile require
# Python >= 3.12). Used by picasso.io to open Zeiss .czi / Leica .lif
# files and PicoQuant .ptu confocal scans (photon counts per pixel);
# absent installs simply do not advertise those formats.
czi = [
    "czifile>=2026.6.12; python_version>='3.12'",
    "imagecodecs>=2026.6.6; python_version>='3.12'",
]
lif = [
    "liffile>=2026.4.11; python_version>='3.12'",
    "imagecodecs>=2026.6.6; python_version>='3.12'",
]
ptu = [
    "ptufile>=2026.11.5; python_version>='3.12'",
]
formats = [
    "picassosr[czi,lif,ptu]",
]
# Vectorial PSF fitting ('vectorfit' fit method) with the VectorFit
# library, CPU build.
vectorfit = [
    "vectorfit-py>=0.3.2",
]
# The same on the GPU ('vectorfit-gpu' fit method), with VectorFit's CUDA
# build. Both builds install the same module, so install one or the other.
# NOTE: DESPITE THE NAME, CUDA13 IS REQUIRED
vectorfit-gpu = [
    "vectorfit-py-cu12>=0.3.2",
]
# Not for general use: the installer* extras exist only to build the
# one-click installers, where every version is pinned exactly so the frozen
# bundles stay reproducible and stable. Regular users should install
# picassosr (optionally with [gpu] / [formats] / [server]) instead.
# They use python 3.14, see, e.g., create_installer_windows.bat.
# installer_base: everything but VectorFit, whose CPU and GPU builds clash
# (both install vectorfit_py), so each edition below adds one of them.
installer_base = [
    "PyQt6==6.11.0",
    "numpy==2.3.5",  # 2.4 breaks HDBSCAN, see picasso/clusterer.py
    "matplotlib==3.10.8",
    "h5py==3.16.0",
    "numba==0.65.0",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "tables==3.11.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.7.2",
    "tqdm==4.67.3",
    "streamlit==1.56.0",
    "nd2==0.11.3",
    "dask==2026.3.0",
    "statsmodels==0.14.6",
    "requests==2.33.1",
    "plotly==6.7.0",
    "psutil==7.2.2",
    "playsound3==3.3.1",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "tifffile==2026.4.11",
    "czifile==2026.6.12",
    "liffile==2026.4.11",
    "ptufile==2026.11.5",
    "imagecodecs==2026.6.6",
    "wgpu==0.32.0",
    "pyinstaller==6.19.0",
    "PyImarisWriter==0.7.0; sys_platform=='win32'",
    "hdf5plugin==6.0.0",
]
# CPU build (also used for the macOS installer)
installer = [
    "picassosr[installer_base]",
    # VectorFit's CPU build, also in installer_cuda12. No macOS wheels.
    "vectorfit-py==0.3.2; sys_platform=='win32' or sys_platform=='linux'",
]
# CUDA 12 build (create_installer_windows_cuda12.bat): identical to the CPU
# installer plus the CUDA 12 runtime (GPU rendering via wgpu is in all
# builds; this one adds CUDA fitting).
# Reuse picassosr[installer] so the pinned versions never drift apart.
# VectorFit stays the CPU build: its GPU build needs CUDA 13.
installer_cuda12 = [
    "picassosr[installer]",
    "numba-cuda[cu12]==0.30.2",
    # numba-cuda's NVIDIA dependencies are pinned too: their wheel layout
    # (vendored DLLs, compiled subpackages) is what release/pyinstaller/hooks
    # bundles, so an unpinned rebuild can silently break the frozen app.
    "cuda-bindings==12.9.9",
    "cuda-core==1.2.1",
    "cuda-pathfinder==1.8.2"
]
# CUDA 13 build: CUDA fitting with the CUDA 13 runtime plus VectorFit's GPU
# build (vectorfit-py-cu12, which despite its name is compiled with
# CUDA 13). Needs an NVIDIA driver R580+ and a Turing or newer GPU (compute
# capability >= 7.5); installer_cuda12 covers older drivers and GPUs.
# Windows only (create_installer_windows_cuda13.bat).
installer_cuda13 = [
    "picassosr[installer_base]",
    "numba-cuda[cu13]==0.30.2",
    # pinned for the same reason as in installer_cuda12; cuda-toolkit pins
    # the exact versions of the nvidia-* runtime wheels it pulls
    "cuda-bindings==13.5.0",
    "cuda-core==1.2.2",
    "cuda-pathfinder==1.8.6",
    "cuda-toolkit==13.5.0",
    "nvidia-nvjitlink==13.5.37",
    "vectorfit-py-cu12==0.3.2; sys_platform=='win32'",
]

[project.urls]
Homepage = "https://picassosr.readthedocs.io/en/latest/"
Documentation = "https://picassosr.readthedocs.io/en/latest/"
Source = "https://github.com/jungmannlab/picasso"
Issues = "https://github.com/jungmannlab/picasso/issues"
Changelog = "https://github.com/jungmannlab/picasso/blob/master/changelog.md"
Publications = "https://doi.org/10.1038/nprot.2017.024"

[project.scripts]
picasso = "picasso.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "picasso.version.__version__"}

[tool.setuptools.packages.find]
include = ["picasso*"]

[tool.setuptools.package-data]
picasso = [
    "gui/icons/*.ico",
    "gui/icons/*.png",
    "gui/icons/*.svg",
    "config_template.yaml",
]

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests (multiprocessing, Bayesian fits, compare_models)",
    "gui: tests that build Qt widgets (applied automatically to anything using the qapp / qt_offscreen fixtures); deselect with -m \"not gui\"",
    "gpu_backend: tests that exercise the real GPU render backend selection (every other test renders on the CPU reference, whatever the machine has)",
]
# a test still running after 10 minutes is stuck: print where every thread
# is (the test keeps running; the slowest take about 2.5 minutes)
faulthandler_timeout = 600

# pytest --cov (pytest-cov) measures which code of Picasso the tests run
[tool.coverage.run]
source = ["picasso"]

[tool.coverage.report]
# least covered first
sort = "Cover"
skip_empty = true
# the CUDA fitting modules run only on an NVIDIA GPU, which CI does not have
omit = ["picasso/fitting/*_cuda.py"]
# Numba compiles these functions to machine code, which coverage cannot
# trace, so they would count as missed even when the tests run them; a
# decorator excluded excludes the whole function
exclude_also = [
    "@(numba\\.)?n?jit\\b",
    "@cuda\\.jit\\b",
]

[tool.black]
line-length = 79
include = "\\.pyi?$"
exclude = '''
(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)
'''
