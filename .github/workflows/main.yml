# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # the one-click installers are built with Python 3.14 on macOS
        # and Windows
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash

    env:
      QT_QPA_PLATFORM: offscreen
      # A GUI test that aborts the interpreter takes pytest's captured output
      # with it; tests/conftest.py writes the exception / Qt message that
      # caused it to this file instead, and the step below prints it.
      PICASSO_CRASH_LOG: ${{ github.workspace }}/pytest-crash.log
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Qt system libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # the server extra too, so that the tests of Picasso Server run
        pip install ".[server]"
    - name: Lint with flake8
      if: runner.os == 'Linux'
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=tests,picasso/ext,dist,release
        # exit-zero treats all errors as warnings. Line length and E203 match black configuration
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=79 --extend-ignore=E203 --statistics --exclude=tests,picasso/ext,dist,release
    - name: Test with pytest
      env:
        # one job measures which code the tests run (pyproject.toml,
        # [tool.coverage]); the others are not slowed down by it
        MEASURE_COVERAGE: ${{ runner.os == 'Linux' && matrix.python-version == '3.14' }}
      run: |
        pip install pytest pytest-cov
        # tee-sys: a crash in a GUI test kills the process before pytest can
        # report the captured output, so the Qt/Python messages that explain
        # it have to reach the log as they are written.
        if [ "$MEASURE_COVERAGE" = true ]; then
          pytest --capture=tee-sys --cov --cov-report=
        else
          pytest --capture=tee-sys
        fi
    - name: Coverage report
      # in the job's summary page, least covered modules first; also when
      # tests failed. Numba-compiled functions and the CUDA modules are left
      # out (pyproject.toml, [tool.coverage.report]).
      if: ${{ !cancelled() && runner.os == 'Linux' && matrix.python-version == '3.14' }}
      run: |
        echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        # the readme's badge, published by the coverage-badge job below
        coverage json -q -o coverage.json
        python - <<'EOF'
        import json

        percent = json.load(open("coverage.json"))["totals"]["percent_covered"]
        colors = ((90, "brightgreen"), (80, "green"), (70, "yellowgreen"),
                  (60, "yellow"), (0, "orange"))
        color = next(c for limit, c in colors if percent >= limit)
        badge = {"schemaVersion": 1, "label": "coverage",
                 "message": f"{percent:.0f}%", "color": color}
        json.dump(badge, open("coverage-badge.json", "w"))
        EOF
    - name: Keep the coverage badge
      if: ${{ success() && runner.os == 'Linux' && matrix.python-version == '3.14' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: coverage-badge.json
    - name: Show the crash log
      if: always()
      run: cat "$PICASSO_CRASH_LOG" || echo "no crash log"

  coverage-badge:
    # The readme's coverage badge reads coverage-badge.json from the
    # "badges" branch (through shields.io). Only master's coverage is
    # published, from a run whose tests passed; the branch holds this one
    # file in a single commit, replaced each time.
    name: Publish the coverage badge
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: coverage-badge
    - name: Push it to the badges branch
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git init -q -b badges site
        mv coverage-badge.json site/
        cd site
        git add coverage-badge.json
        git -c user.name="github-actions[bot]" \
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -q -m "Coverage badge of ${GITHUB_SHA::7}"
        git push -q --force \
          "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          badges

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"  # as on Read the Docs (.readthedocs.yaml)
    - name: Install Sphinx and Picasso
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt .
    - name: Build the documentation, failing on warnings
      # like fail_on_warning on Read the Docs, but shown on the commit;
      # --keep-going lists all warnings, not only the first
      run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  test-minimum-versions:
      runs-on: ubuntu-latest
      env:
        QT_QPA_PLATFORM: offscreen
        PICASSO_CRASH_LOG: ${{ github.workspace }}/pytest-crash.log
      steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxkbcommon0
      - run: |
          grep -oE '"[A-Za-z0-9_.\-]+>=[^",]+' pyproject.toml | tr -d '"' | sed 's/>=/==/' > constraints-minimum.txt
          cat constraints-minimum.txt
          python -m pip install --upgrade pip
          pip install ".[server]" --constraint constraints-minimum.txt
          pip install pytest
          pytest --capture=tee-sys
      - name: Show the crash log
        if: always()
        run: cat "$PICASSO_CRASH_LOG" || echo "no crash log"
