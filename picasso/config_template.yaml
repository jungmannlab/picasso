CameraPriority:
  # Does not have to display all cameras, the ones listed here will be displayed first in Picasso Localize's parameters dialog
  - HamamatsuHam_DCAM
  - Andor Zyla 4.2 Plus
Cameras:
  Andor Zyla 4.2 Plus:
    Pixelsize: 130
    Baseline: 100
    Sensitivity Categories:
      - PixelReadoutRate
      - Sensitivity/DynamicRange
    Sensitivity:
      540 MHz - fastest readout:
        12-bit (high well capacity): 7.18
        12-bit (low noise): 0.29
        16-bit (low noise & high well capacity): 0.46
      200 MHz - lowest noise:
        12-bit (high well capacity): 7.0
        12-bit (low noise): 0.26
        16-bit (low noise & high well capacity): 0.45
    Channel Device:
      # Optional: selects the emission wavelength automatically for
      # Micro-Manager movies. (For any movie, the wavelength can be
      # selected by hand in the "Emission Wavelength" dropdown of Localize's
      # Parameters dialog, which lists the wavelengths of the calibration
      # sections below and of this entry.) Name: the Micro-Manager metadata
      # key (device-property) of the device that sets the emission channel.
      # Emission Wavelengths: the values Micro-Manager saves for that key,
      # each mapped to its emission wavelength in nm.
      Name: FilterTurret1-Label
      Emission Wavelengths:
        1-TIRF 488: 525
        2-TIRF 560: 595
        3-TIRF 640: 700   
  Andor iXon X-9603:
    Baseline: 200
    Gain Property Name: Gain
    Sensitivity Categories:
      - Output_Amplifier
      - ReadoutMode
      - Pre-Amp-Gain
    Sensitivity:
      Electron Multiplying:
        17.000 MHz:
          Gain 1: 15.9
          Gain 2: 9.34
          Gain 3: 5.32
        10.000 MHz:
          Gain 1: 16.5
          Gain 2: 8.4
          Gain 3: 5.12
        5.000 MHz:
          Gain 1: 18.1
          Gain 2: 8.74
          Gain 3: 4.63
        1.000 MHz:
          Gain 1: 18.3
          Gain 2: 8.86
          Gain 3: 4.58
      Conventional:
        3.000 MHz:
          Gain 1: 4.03
          Gain 2: 3.14
          Gain 3: 1.47
        1.000 MHz:
          Gain 1: 4.09
          Gain 2: 3.09
          Gain 3: 1.47
        0.080 MHz:
          Gain 1: 4.04
          Gain 2: 3.09
          Gain 3: 1.44
    Channel Device:
      # Optional: Micro-Manager filter position -> emission wavelength
      # in nm, see the first camera
      Name: TIFilterBlock1-Label
      Emission Wavelengths:
        1-R640: 700
        2-G561: 595
        3-B489: 525
  Andor Zyla VSC-01223:
    Baseline: 100
    Sensitivity Categories:
      - PixelReadoutRate
      - Sensitivity/DynamicRange
    Sensitivity:
      540 MHz - fastest readout:
        12-bit (high well capacity): 7.18
        12-bit (low noise): 0.29
        16-bit (low noise & high well capacity): 0.46
      200 MHz - lowest noise:
        12-bit (high well capacity): 7.0
        12-bit (low noise): 0.26
        16-bit (low noise & high well capacity): 0.45
    Channel Device:
      # Optional: Micro-Manager filter position -> emission wavelength
      # in nm, see the first camera
      Name: TIFilterBlock1-Label
      Emission Wavelengths:
        1-R640: 700
        2-G561: 595
        3-B489: 525
  HamamatsuHam_DCAM:
    Baseline: 100
    Channel Device:
      # Optional: Micro-Manager filter position -> emission wavelength
      # in nm, see the first camera
      Name: TIFilterBlock1-Label
      Emission Wavelengths:
        1-R640: 700
        2-G561: 595
        3-B489: 525
    Sensitivity: 0.47
  Simulation:
    Pixelsize: 130
    Baseline: 0
    Sensitivity: 1.0
# The calibration sections are keyed by camera and then by emission
# wavelength in nm, which is selected in Localize's "Emission
# Wavelength" dropdown (automatically for Micro-Manager movies with a
# Channel Device entry above). A single path in place of the wavelengths
# serves every wavelength of that camera.
z-calibrations: # 3D astigmatism calibrations (.yaml)
  HamamatsuHam_DCAM:
    525: C:/path/to/your_3d_calib_525nm.yaml
    595: C:/path/to/your_3d_calib_595nm.yaml
    700: C:/path/to/your_3d_calib_700nm.yaml
  Andor Zyla 4.2 Plus:
    525: C:/path/to/your_3d_calib_525nm_another_camera.yaml
    595: C:/path/to/your_3d_calib_595nm_another_camera.yaml
    700: C:/path/to/your_3d_calib_700nm_another_camera.yaml
spline-calibrations: # Experimental PSF (cubic spline) calibrations (.hdf5)
  HamamatsuHam_DCAM:
    525: C:/path/to/your_spline_calib_525nm.hdf5
    595: C:/path/to/your_spline_calib_595nm.hdf5
    700: C:/path/to/your_spline_calib_700nm.hdf5
  Andor Zyla 4.2 Plus:
    525: C:/path/to/your_spline_calib_525nm_another_camera.hdf5
    595: C:/path/to/your_spline_calib_595nm_another_camera.hdf5
    700: C:/path/to/your_spline_calib_700nm_another_camera.hdf5
camera-calibrations: # Per-pixel sCMOS offset/variance/gain maps (Huang et al. 2013, .hdf5)
  HamamatsuHam_DCAM:
    525: C:/path/to/your_scmos_calib_525.hdf5
    595: C:/path/to/your_scmos_calib_595.hdf5
    700: C:/path/to/your_scmos_calib_700.hdf5
  Andor Zyla 4.2 Plus:
    525: C:/path/to/your_scmos_calib_another_camera_525.hdf5
    595: C:/path/to/your_scmos_calib_another_camera_595.hdf5
    700: C:/path/to/your_scmos_calib_another_camera_700.hdf5
  
