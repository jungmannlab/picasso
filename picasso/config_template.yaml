CameraPriority:
  # Does not have to display all cameras, the ones listed here will be displayed first in Picasso Localize's parameters dialog
  - HamamatsuHam_DCAM
  - Andor Zyla 4.2 Plus
Cameras:
  Andor Zyla 4.2 Plus:
    Pixelsize: 130
    Baseline: 100
    Sensitivity Categories:
      - PixelReadoutRate
      - Sensitivity/DynamicRange
    Sensitivity:
      540 MHz - fastest readout:
        12-bit (high well capacity): 7.18
        12-bit (low noise): 0.29
        16-bit (low noise & high well capacity): 0.46
      200 MHz - lowest noise:
        12-bit (high well capacity): 7.0
        12-bit (low noise): 0.26
        16-bit (low noise & high well capacity): 0.45
    Channel Device:
      # This information is used to automatically set the emission wavelength based on MicroManager metadata
      Name: FilterTurret1-Label
      Emission Wavelengths:
        1-TIRF 488: 525
        2-TIRF 560: 595
        3-TIRF 640: 700   
  Andor iXon X-9603:
    Baseline: 200
    Gain Property Name: Gain
    Sensitivity Categories:
      - Output_Amplifier
      - ReadoutMode
      - Pre-Amp-Gain
    Sensitivity:
      Electron Multiplying:
        17.000 MHz:
          Gain 1: 15.9
          Gain 2: 9.34
          Gain 3: 5.32
        10.000 MHz:
          Gain 1: 16.5
          Gain 2: 8.4
          Gain 3: 5.12
        5.000 MHz:
          Gain 1: 18.1
          Gain 2: 8.74
          Gain 3: 4.63
        1.000 MHz:
          Gain 1: 18.3
          Gain 2: 8.86
          Gain 3: 4.58
      Conventional:
        3.000 MHz:
          Gain 1: 4.03
          Gain 2: 3.14
          Gain 3: 1.47
        1.000 MHz:
          Gain 1: 4.09
          Gain 2: 3.09
          Gain 3: 1.47
        0.080 MHz:
          Gain 1: 4.04
          Gain 2: 3.09
          Gain 3: 1.44
    Channel Device:
      # This information is used to automatically set the emission wavelength based on MicroManager metadata
      Name: TIFilterBlock1-Label
      Emission Wavelengths:
        1-R640: 700
        2-G561: 595
        3-B489: 525
  Andor Zyla VSC-01223:
    Baseline: 100
    Sensitivity Categories:
      - PixelReadoutRate
      - Sensitivity/DynamicRange
    Sensitivity:
      540 MHz - fastest readout:
        12-bit (high well capacity): 7.18
        12-bit (low noise): 0.29
        16-bit (low noise & high well capacity): 0.46
      200 MHz - lowest noise:
        12-bit (high well capacity): 7.0
        12-bit (low noise): 0.26
        16-bit (low noise & high well capacity): 0.45
    Channel Device:
      # This information is used to automatically set the emission wavelength based on MicroManager metadata
      Name: TIFilterBlock1-Label
      Emission Wavelengths:
        1-R640: 700
        2-G561: 595
        3-B489: 525
  HamamatsuHam_DCAM:
    Baseline: 100
    Channel Device:
      # This information is used to automatically set the emission wavelength based on MicroManager metadata
      Name: TIFilterBlock1-Label
      Emission Wavelengths:
        1-R640: 700
        2-G561: 595
        3-B489: 525
    Sensitivity: 0.47
  Simulation:
    Pixelsize: 130
    Baseline: 0
    Sensitivity: 1.0
z-calibrations: # This information is used to automatically set the z calibration file based on MicroManager metadata
  HamamatsuHam_DCAM:
    525: C:/path/to/your_3d_calib_525nm.yaml
    595: C:/path/to/your_3d_calib_595nm.yaml
    700: C:/path/to/your_3d_calib_700nm.yaml
  Andor Zyla 4.2 Plus:
    525: C:/path/to/your_3d_calib_525nm_another_camera.yaml
    595: C:/path/to/your_3d_calib_595nm_another_camera.yaml
    700: C:/path/to/your_3d_calib_700nm_another_camera.yaml
spline-calibrations: # This information is used to automatically set the experimental PSF (cubic spline) calibration file based on MicroManager metadata
  HamamatsuHam_DCAM:
    525: C:/path/to/your_spline_calib_525nm.hdf5
    595: C:/path/to/your_spline_calib_595nm.hdf5
    700: C:/path/to/your_spline_calib_700nm.hdf5
  Andor Zyla 4.2 Plus:
    525: C:/path/to/your_spline_calib_525nm_another_camera.hdf5
    595: C:/path/to/your_spline_calib_595nm_another_camera.hdf5
    700: C:/path/to/your_spline_calib_700nm_another_camera.hdf5
camera-calibrations: # Per-pixel sCMOS offset/variance/gain maps (Huang et al. 2013)
  HamamatsuHam_DCAM:
    525: C:/path/to/your_scmos_calib_525.hdf5
    595: C:/path/to/your_scmos_calib_595.hdf5
    700: C:/path/to/your_scmos_calib_700.hdf5
  Andor Zyla 4.2 Plus:
    525: C:/path/to/your_scmos_calib_another_camera_525.hdf5
    595: C:/path/to/your_scmos_calib_another_camera_595.hdf5
    700: C:/path/to/your_scmos_calib_another_camera_700.hdf5
  
